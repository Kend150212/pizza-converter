[package]
name = "convertx-engine"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ConvertX conversion engine — 100% original code. Images via `image`, PDF via `printpdf`/`lopdf`."

[dependencies]
image = { version = "0.24", features = ["avif"] }
printpdf = { version = "0.7", features = ["embedded_images"] }
lopdf = "0.32"
thiserror = "1"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
quick-xml = { version = "0.36", features = ["serialize"] }
calamine = "0.24"
rust_xlsxwriter = "0.102.0"
zip = "2"

[dev-dependencies]
tempfile = "3"
